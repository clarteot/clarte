<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/pako.min.js"></script>
  <script src="invite-policy.js?v=frontend-20261014"></script>
  <script src="release-patch-v26-5-2.js?v=26.5.2"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#F7F9FB">
  <title>Clarte·我的手账管理</title>
  <style>
    :root{--bg:#f6f8fa;--card:#fff;--ink:#314844;--muted:#81918f;--line:#d8e5e2;--teal:#3c8881}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink)}
    body{min-height:100vh}
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .gate-card{width:min(430px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:34px 28px 30px;box-shadow:0 18px 50px rgba(53,89,84,.08)}
    .eyebrow{margin:0 0 10px;color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.22em}
    h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
    .sub{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.7}
    label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}
    input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 15px;background:#fbfdfd;color:var(--ink);font-size:16px;outline:none;text-transform:uppercase;letter-spacing:.04em}
    input:focus{border-color:#83b7b1;box-shadow:0 0 0 3px rgba(60,136,129,.1)}
    button{width:100%;height:50px;margin-top:13px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    .msg{min-height:21px;margin:10px 2px 0;font-size:12px;color:#b25d57}
    .note{margin:19px 0 0;padding-top:17px;border-top:1px solid #edf2f1;color:#99a6a4;font-size:11px;line-height:1.65}
    .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
<script>
(() => {
  const ACCESS_KEY='clarte_frontend_access_v1';
  const policy=window.CLARTE_INVITE_POLICY;
  let expiryTimer;
  const PAYLOADS=["payload-v26-4-01.txt","payload-v26-4-02.txt","payload-v26-4-03.txt","payload-v26-4-04.txt","payload-v26-4-05.txt","payload-v26-4-06.txt","payload-v26-4-07.txt","payload-v26-4-08.txt","payload-v26-4-09.txt","payload-v26-4-10.txt","payload-v26-4-11.txt","payload-v26-4-12.txt","payload-v26-4-13.txt","payload-v26-4-14.txt","payload-v26-4-15.txt","payload-v26-4-16.txt"];
  const CLARTE_RELEASE="26.5.2";
  const PAYLOAD_BASE64_LENGTH=90560;

  function policyValid(){
    return policy && typeof policy.version==='string' && Array.isArray(policy.hashes) && Number.isFinite(Date.parse(policy.expiresAt));
  }
  function expired(){ return Date.now()>=Date.parse(policy.expiresAt); }
  function readAccess(){ try{return JSON.parse(localStorage.getItem(ACCESS_KEY));}catch{return null;} }
  function allowed(access){return policyValid() && !expired() && access && access.version===policy.version && policy.hashes.includes(access.hash);}
  function normalize(code){return code.trim().toUpperCase().replace(/[‐‑‒–—−－]/g,'-');}
  async function digest(code){
    const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code));
    return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
  }
  function guardExpiry(){
    if(!expired() || document.getElementById('clarteExpiryNotice'))return;
    const overlay=document.createElement('div');
    overlay.id='clarteExpiryNotice';
    overlay.setAttribute('role','alertdialog');
    overlay.setAttribute('aria-modal','true');
    overlay.tabIndex=-1;
    overlay.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#f6f8faf5;display:flex;align-items:center;justify-content:center;padding:24px;color:#314844;font:16px/1.8 sans-serif;text-align:center';
    overlay.textContent='本批邀请码已到期，请联系 Clarte 获取新的访问方式。当前页面内容已保留，请勿清除网站数据。';
    document.body.appendChild(overlay);
    overlay.focus();
    overlay.addEventListener('keydown',e=>{e.preventDefault();e.stopPropagation();});
  }

  async function loadApp(){
    document.body.innerHTML='<div class="loading">正在打开 Clarte…</div>';
    try{
      if(typeof window.CLARTE_RELEASE_PATCH!=='function' || window.CLARTE_RELEASE_PATCH_VERSION!=='26.5.2'){
        throw Error('Clarte release patch unavailable');
      }
      const encoded=(await Promise.all(
        PAYLOADS.map(async p=>{
          const controller=new AbortController();
          const timer=setTimeout(()=>controller.abort(),10000);
          try{
            const r=await fetch(p,{cache:'no-store',signal:controller.signal});
            if(!r.ok) throw Error(p+' '+r.status);
            return await r.text();
          }finally{
            clearTimeout(timer);
          }
        })
      )).join('').replace(/\s+/g,'');
      if(encoded.length!==PAYLOAD_BASE64_LENGTH) throw Error('Clarte bundle length mismatch');
      const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
      let html=new TextDecoder().decode(pako.ungzip(bytes));
      html=window.CLARTE_RELEASE_PATCH(html);
      document.open();document.write(html);document.close();
      clearInterval(expiryTimer);
      expiryTimer=setInterval(guardExpiry,30000);
      window.addEventListener("pageshow",guardExpiry);
      document.addEventListener("visibilitychange",guardExpiry);
      guardExpiry();
    }catch(e){
      document.body.innerHTML='<div class="loading">Clarte 加载失败，请刷新页面重试。</div>';
      console.error(e);
    }
  }

  function showGate(message=''){
    document.body.innerHTML=`<main class="gate"><section class="gate-card">
      <p class="eyebrow">CLARTE · PRIVATE BETA</p>
      <h1>欢迎来到 Clarte</h1>
      <p class="sub">目前处于内测阶段，请输入邀请码后继续。</p>
      <form id="inviteForm">
        <label for="inviteCode">邀请码</label>
        <input id="inviteCode" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="CLARTE-XXXX-XXXX">
        <button id="inviteBtn" type="submit">进入 Clarte</button>
        <p class="msg" id="inviteMsg">${message}</p>
      </form>
      <p class="note">邀请码在当前浏览器内校验，可在不同设备和浏览器重复使用。有效期至北京时间 2027 年 4 月 14 日 13:18:31；到期后需要新的邀请码。</p>
    </section></main>`;
    const form=document.getElementById('inviteForm');
    const input=document.getElementById('inviteCode');
    const btn=document.getElementById('inviteBtn');
    const msg=document.getElementById('inviteMsg');
    setTimeout(()=>input.focus(),60);
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      msg.textContent='';
      const code=normalize(input.value);
      if(!code){msg.textContent='请输入邀请码';return}
      btn.disabled=true;btn.textContent='验证中…';
      try{
        if(!policyValid())throw Error('policy_unavailable');
        if(expired()){msg.textContent='本批邀请码已过期，请联系 Clarte';}
        else{
          const hash=await digest(code);
          if(policy.hashes.includes(hash)){
            try{localStorage.setItem(ACCESS_KEY,JSON.stringify({version:policy.version,hash}));}catch{}
            await loadApp();return;
          }
          msg.textContent='邀请码无效，请检查后重试';
        }
        input.select();
      }catch(err){
        msg.textContent='本地验证组件未能加载，请刷新页面或使用较新版本的浏览器';
        console.error(err);
      }
      btn.disabled=false;btn.textContent='进入 Clarte';
    });
  }

  async function start(){
    if(!policyValid()){showGate('验证规则加载失败，请刷新页面重试');return;}
    if(expired()){showGate('本批邀请码已过期，请联系 Clarte');return;}
    if(allowed(readAccess())){await loadApp();return;}
    showGate();
  }

  start();
})();
</script>
</body>
</html>
