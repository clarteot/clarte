<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Clarte·我的手账管理</title></head><body><script>(async()=>{try{const ps=["payload-1.txt", "payload-2.txt", "payload-3.txt", "payload-4.txt", "payload-5.txt", "payload-6.txt", "payload-7.txt"],s=(await Promise.all(ps.map(p=>fetch(p).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})))).join(''),b=Uint8Array.from(atob(s),c=>c.charCodeAt(0)),t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<p style="font:16px sans-serif;padding:24px">Clarte 加载失败，请刷新页面重试。</p>';console.error(e)}})()</script></body></html>
