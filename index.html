<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#F7F9FB">
  <title>Clarte·我的手账管理</title>
  <style>
    :root{--bg:#f6f8fa;--card:#fff;--ink:#314844;--muted:#81918f;--line:#d8e5e2;--teal:#3c8881}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink)}
    body{min-height:100vh}
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .gate-card{width:min(430px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:34px 28px 30px;box-shadow:0 18px 50px rgba(53,89,84,.08)}
    .eyebrow{margin:0 0 10px;color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.22em}
    h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
    .sub{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.7}
    label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}
    input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 15px;background:#fbfdfd;color:var(--ink);font-size:16px;outline:none;text-transform:uppercase;letter-spacing:.04em}
    input:focus{border-color:#83b7b1;box-shadow:0 0 0 3px rgba(60,136,129,.1)}
    button{width:100%;height:50px;margin-top:13px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    .msg{min-height:21px;margin:10px 2px 0;font-size:12px;color:#b25d57}
    .note{margin:19px 0 0;padding-top:17px;border-top:1px solid #edf2f1;color:#99a6a4;font-size:11px;line-height:1.65}
    .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
<script>
(() => {
  const API='https://clarte-invite-api.13136138332.workers.dev';
  const ACCESS_TOKEN_KEY='clarte_beta_access_token_v2';
  const LEGACY_ACCESS_KEY='clarte_beta_access_v1';
  const PAYLOADS=['payload-v23-fixed-01.txt','payload-v23-fixed-02.txt','payload-v23-fixed-03.txt','payload-v23-fixed-04.txt','payload-v23-fixed-05.txt','payload-v23-fixed-06.txt','payload-v23-fixed-07.txt','payload-v23-fixed-08.txt','payload-v23-fixed-09a.txt','payload-v23-fixed-09b.txt','payload-v23-fixed-10a.txt','payload-v23-fixed-10b.txt','payload-v23-fixed-11a.txt','payload-v23-fixed-11b.txt','payload-v23-fixed-12a.txt','payload-v23-fixed-12b.txt','payload-v23-fixed-13a.txt','payload-v23-fixed-13b.txt'];

  async function apiPost(path, body, token=''){
    const headers={'content-type':'application/json'};
    if(token) headers.authorization=`Bearer ${token}`;
    const response=await fetch(`${API}${path}`,{
      method:'POST',
      headers,
      body:JSON.stringify(body||{}),
      cache:'no-store'
    });
    let data={};
    try{data=await response.json()}catch{}
    return {ok:response.ok,status:response.status,data};
  }

  async function loadApp(){
    document.body.innerHTML='<div class="loading">正在打开 Clarte…</div>';
    try{
      const encoded=(await Promise.all(PAYLOADS.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})))).join('').replace(/\s+/g,'');
      const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
      const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      document.open();document.write(html);document.close();
    }catch(e){
      document.body.innerHTML='<div class="loading">Clarte 加载失败，请刷新页面重试。</div>';
      console.error(e);
    }
  }

  function inviteError(error,status){
    if(error==='invite_invalid') return '邀请码无效，请检查后重试';
    if(error==='invite_expired') return '邀请码已过期';
    if(error==='invite_already_used' || status===409) return '这个邀请码已经使用过了';
    if(error==='origin_not_allowed') return '当前访问地址暂未授权';
    if(status>=500) return '服务暂时不可用，请稍后重试';
    return '验证失败，请稍后重试';
  }

  function showGate(message=''){
    document.body.innerHTML=`<main class="gate"><section class="gate-card">
      <p class="eyebrow">CLARTE · PRIVATE BETA</p>
      <h1>欢迎来到 Clarte</h1>
      <p class="sub">目前处于内测阶段，请输入邀请码后继续。</p>
      <form id="inviteForm">
        <label for="inviteCode">邀请码</label>
        <input id="inviteCode" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="CLARTE-XXXX-XXXX">
        <button id="inviteBtn" type="submit">进入 Clarte</button>
        <p class="msg" id="inviteMsg">${message}</p>
      </form>
      <p class="note">邀请码由 Clarte 服务端验证。验证成功后，本设备会保存访问凭证；凭证失效或访问被撤销时需要重新验证。</p>
    </section></main>`;
    const form=document.getElementById('inviteForm');
    const input=document.getElementById('inviteCode');
    const btn=document.getElementById('inviteBtn');
    const msg=document.getElementById('inviteMsg');
    setTimeout(()=>input.focus(),60);
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      msg.textContent='';
      const code=input.value.trim();
      if(!code){msg.textContent='请输入邀请码';return}
      btn.disabled=true;btn.textContent='验证中…';
      try{
        const result=await apiPost('/redeem',{code});
        if(result.ok && result.data?.token){
          localStorage.setItem(ACCESS_TOKEN_KEY,result.data.token);
          localStorage.removeItem(LEGACY_ACCESS_KEY);
          await loadApp();
          return;
        }
        msg.textContent=inviteError(result.data?.error,result.status);
        input.select();
      }catch(err){
        msg.textContent='无法连接验证服务，请检查网络后重试';
        console.error(err);
      }
      btn.disabled=false;btn.textContent='进入 Clarte';
    });
  }

  async function start(){
    const token=localStorage.getItem(ACCESS_TOKEN_KEY);
    if(!token){
      localStorage.removeItem(LEGACY_ACCESS_KEY);
      showGate();
      return;
    }
    document.body.innerHTML='<div class="loading">正在验证访问权限…</div>';
    try{
      const result=await apiPost('/verify',{},token);
      if(result.ok){await loadApp();return}
      localStorage.removeItem(ACCESS_TOKEN_KEY);
      showGate(result.data?.error==='access_revoked'?'当前访问权限已被撤销，请重新输入邀请码。':'访问凭证已失效，请重新输入邀请码。');
    }catch(err){
      showGate('暂时无法连接验证服务，请稍后重试。');
      console.error(err);
    }
  }

  start();
})();
</script>
</body>
</html>
