<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Clarte · 邀请码管理</title>
  <style>
    :root{--bg:#f6f8fa;--card:#fff;--ink:#314844;--muted:#81918f;--line:#d8e5e2;--teal:#3c8881;--danger:#b25d57;--soft:#eef6f4}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{max-width:1040px;margin:0 auto;padding:34px 20px 60px}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--teal);margin-bottom:7px}
    h1{margin:0;font-size:30px;letter-spacing:-.02em}.sub{margin:7px 0 0;color:var(--muted);font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(53,89,84,.05);margin-bottom:16px}
    .grid{display:grid;grid-template-columns:1.4fr .7fr 1fr auto;gap:12px;align-items:end}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
    input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fbfdfd;color:var(--ink);font-size:14px;outline:none}
    input:focus,select:focus{border-color:#83b7b1;box-shadow:0 0 0 3px rgba(60,136,129,.09)}
    button{height:44px;border:0;border-radius:12px;padding:0 16px;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
    button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff;color:var(--danger);border:1px solid #ead2d0}
    button:disabled{opacity:.55;cursor:default}
    .login{max-width:540px;margin:12vh auto 0}.login h2{margin-top:0}.login-row{display:flex;gap:10px}.login-row input{flex:1}
    .msg{min-height:20px;margin:10px 0 0;color:var(--danger);font-size:12px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar h2{font-size:18px;margin:0}.toolbar-actions{display:flex;gap:8px}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 10px;border-top:1px solid #edf2f1;text-align:left;vertical-align:middle}th{color:var(--muted);font-size:11px;font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;background:var(--soft)}.pill.off{background:#f5eeee;color:#9a6560}.muted{color:var(--muted)}
    .new-code{display:none;margin-top:14px;background:var(--soft);border-radius:14px;padding:14px}.new-code.show{display:block}.code-line{display:flex;justify-content:space-between;gap:12px;align-items:center}.code-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.code{font-size:18px;font-weight:800;letter-spacing:.05em}.small{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}
    .empty{text-align:center;color:var(--muted);padding:28px 0}.mobile-list{display:none}
    @media(max-width:760px){.wrap{padding:24px 14px 50px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.table-wrap{display:none}.mobile-list{display:block}.invite-item{padding:14px 0;border-top:1px solid #edf2f1}.invite-head{display:flex;justify-content:space-between;gap:10px}.invite-meta{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.invite-actions{margin-top:10px}.invite-actions button{height:36px}.login-row{flex-direction:column}.code-line{align-items:flex-start;flex-direction:column}.code-actions{width:100%;justify-content:flex-start}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const API='https://clarte-invite-api.13136138332.workers.dev';
  const TOKEN_KEY='clarte_admin_token_session';
  const CLARTE_URL='https://clarteot.github.io/clarte/';
  const app=document.getElementById('app');
  let adminToken=sessionStorage.getItem(TOKEN_KEY)||'';
  let invites=[];
  let lastCreatedCode='';

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=s=>{if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?'—':d.toLocaleString('zh-CN',{hour12:false})};
  async function api(path,opts={}){
    const headers={'content-type':'application/json',...(opts.headers||{})};
    if(adminToken) headers.authorization=`Bearer ${adminToken}`;
    const r=await fetch(API+path,{...opts,headers,cache:'no-store'});
    let data={};try{data=await r.json()}catch{}
    if(r.status===401) throw Object.assign(new Error('unauthorized'),{status:401});
    if(!r.ok) throw Object.assign(new Error(data.error||'request_failed'),{status:r.status,data});
    return data;
  }

  function renderLogin(message=''){
    app.innerHTML=`<main class="wrap"><section class="card login">
      <div class="eyebrow">CLARTE · ADMIN</div><h2>邀请码管理</h2>
      <p class="sub">请输入管理员令牌。令牌只保存在当前浏览器会话中，关闭标签页后自动清除。</p>
      <div class="login-row"><input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN"><button id="loginBtn">进入后台</button></div>
      <p class="msg">${esc(message)}</p>
    </section></main>`;
    document.getElementById('loginBtn').onclick=async()=>{
      const input=document.getElementById('token');adminToken=input.value.trim();if(!adminToken)return;
      try{await api('/admin/invites',{method:'GET'});sessionStorage.setItem(TOKEN_KEY,adminToken);await load();}
      catch(e){adminToken='';sessionStorage.removeItem(TOKEN_KEY);renderLogin('管理员令牌不正确或服务暂时不可用');}
    };
  }

  function statusPill(i){
    if(i.active!==1) return '<span class="pill off">已作废</span>';
    if(i.expires_at && Date.parse(i.expires_at)<=Date.now()) return '<span class="pill off">已过期</span>';
    if(i.used_count>=i.max_uses) return '<span class="pill off">已用完</span>';
    return '<span class="pill">可使用</span>';
  }

  function render(){
    app.innerHTML=`<main class="wrap">
      <header class="top"><div><div class="eyebrow">CLARTE · ADMIN</div><h1>邀请码管理</h1><p class="sub">生成、查看使用状态和作废邀请码。</p></div><button class="secondary" id="logout">退出后台</button></header>
      <section class="card">
        <div class="toolbar"><h2>生成邀请码</h2></div>
        <div class="grid">
          <div><label>备注 / 给谁</label><input id="label" maxlength="80" placeholder="例如：小红书内测-小A"></div>
          <div><label>可使用次数</label><select id="maxUses"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option><option value="5">5 次</option><option value="10">10 次</option><option value="20">20 次</option></select></div>
          <div><label>过期时间（可选）</label><input id="expires" type="datetime-local"></div>
          <button id="createBtn">生成邀请码</button>
        </div>
        <div class="new-code ${lastCreatedCode?'show':''}" id="newCode"><div class="code-line"><div><div class="muted" style="font-size:11px;margin-bottom:4px">新邀请码</div><div class="code mono" id="codeText">${esc(lastCreatedCode)}</div></div><div class="code-actions"><button class="secondary" id="copyBtn">复制邀请码</button><button class="secondary" id="copyInviteBtn">复制邀请文案</button></div></div><div class="small">邀请码明文只会在创建时返回一次。复制并保存后，数据库只保留哈希和末四位提示。</div></div>
        <p class="msg" id="createMsg"></p>
      </section>
      <section class="card">
        <div class="toolbar"><h2>邀请码列表</h2><div class="toolbar-actions"><button class="secondary" id="refresh">刷新</button></div></div>
        <div class="table-wrap"><table><thead><tr><th>状态</th><th>备注</th><th>末四位</th><th>使用</th><th>创建时间</th><th>最后使用</th><th>操作</th></tr></thead><tbody>${invites.map(i=>`<tr><td>${statusPill(i)}</td><td>${esc(i.label||'—')}</td><td class="mono">${esc(i.code_hint)}</td><td>${i.used_count}/${i.max_uses}</td><td>${fmt(i.created_at)}</td><td>${fmt(i.last_used_at)}</td><td>${i.active===1?`<button class="danger revoke" data-id="${esc(i.id)}">作废</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">还没有邀请码</td></tr>'}</tbody></table></div>
        <div class="mobile-list">${invites.map(i=>`<div class="invite-item"><div class="invite-head"><div><strong>${esc(i.label||'未备注')}</strong><div class="muted mono" style="margin-top:4px">•••• ${esc(i.code_hint)}</div></div>${statusPill(i)}</div><div class="invite-meta"><span>使用 ${i.used_count}/${i.max_uses}</span><span>创建 ${fmt(i.created_at)}</span></div>${i.active===1?`<div class="invite-actions"><button class="danger revoke" data-id="${esc(i.id)}">作废</button></div>`:''}</div>`).join('')||'<div class="empty">还没有邀请码</div>'}</div>
      </section>
    </main>`;
    bind();
  }

  function bind(){
    document.getElementById('logout').onclick=()=>{adminToken='';sessionStorage.removeItem(TOKEN_KEY);renderLogin();};
    document.getElementById('refresh').onclick=load;
    document.getElementById('createBtn').onclick=createInvite;
    const copyBtn=document.getElementById('copyBtn');if(copyBtn&&lastCreatedCode)copyBtn.onclick=copyCode;
    const copyInviteBtn=document.getElementById('copyInviteBtn');if(copyInviteBtn&&lastCreatedCode)copyInviteBtn.onclick=copyInviteText;
    document.querySelectorAll('.revoke').forEach(b=>b.onclick=()=>revokeInvite(b.dataset.id));
  }

  async function load(){
    try{const data=await api('/admin/invites',{method:'GET'});invites=data.invites||[];render();}
    catch(e){if(e.status===401){adminToken='';sessionStorage.removeItem(TOKEN_KEY);renderLogin('管理员令牌已失效，请重新输入');}else renderLogin('无法加载邀请码列表');}
  }

  async function createInvite(){
    const btn=document.getElementById('createBtn'),msg=document.getElementById('createMsg');
    const label=document.getElementById('label').value.trim();
    const maxUses=Number(document.getElementById('maxUses').value)||1;
    const raw=document.getElementById('expires').value;
    const expiresAt=raw?new Date(raw).toISOString():null;
    btn.disabled=true;btn.textContent='生成中…';msg.textContent='';
    try{
      const data=await api('/admin/invites',{method:'POST',body:JSON.stringify({label,maxUses,expiresAt})});
      lastCreatedCode=data.invite?.code||'';
      await load();
    }catch(e){msg.textContent=e.status===401?'管理员令牌已失效':'生成失败，请稍后重试';}
    btn.disabled=false;btn.textContent='生成邀请码';
  }

  async function copyCode(){
    if(!lastCreatedCode)return;
    await navigator.clipboard.writeText(lastCreatedCode);
    const btn=document.getElementById('copyBtn');if(btn){btn.textContent='已复制';setTimeout(()=>{if(btn.isConnected)btn.textContent='复制邀请码'},1200)}
  }

  async function copyInviteText(){
    if(!lastCreatedCode)return;
    const text=`你好～这是 Clarte 的内测邀请：\n\n访问地址：${CLARTE_URL}\n邀请码：${lastCreatedCode}\n\n打开链接后输入邀请码即可进入。邀请码仅供本次内测使用，请不要转发给其他人。`;
    await navigator.clipboard.writeText(text);
    const btn=document.getElementById('copyInviteBtn');
    if(btn){btn.textContent='已复制文案';setTimeout(()=>{if(btn.isConnected)btn.textContent='复制邀请文案'},1400)}
  }

  async function revokeInvite(id){
    if(!confirm('确定要作废这枚邀请码吗？作废后，已经签发的访问凭证也会失效。'))return;
    try{await api(`/admin/invites/${encodeURIComponent(id)}/revoke`,{method:'POST',body:'{}'});await load();}
    catch(e){alert('作废失败，请刷新后重试');}
  }

  if(adminToken) load(); else renderLogin();
})();
</script>
</body>
</html>
